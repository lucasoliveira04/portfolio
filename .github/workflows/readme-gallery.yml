name: README Lab
on:
  push:
    branches: [codex/nine-profile-readmes, develop, main, angular]
    paths: ['github-profile-readmes/**', 'scripts/**', 'src/app/pages/readme-gallery/**', 'src/app/core/app.routes.ts', 'src/app/components/header/**', 'src/app/components/footer/**', 'angular.json', '.github/workflows/readme-gallery.yml']
  pull_request:
    paths: ['github-profile-readmes/**', 'scripts/**', 'src/app/pages/readme-gallery/**', 'src/app/core/app.routes.ts', 'src/app/components/header/**', 'src/app/components/footer/**', 'angular.json', '.github/workflows/readme-gallery.yml']
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: readme-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test github-profile-readmes/scripts/profile.test.mjs
      - run: node scripts/check-readme-gallery.mjs
      - run: npm test -- --watch=false
      - run: npm run build
      - name: Verify real contribution snake generation
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: lucasoliveira04
          outputs: .readme-validation/snake.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  refresh:
    needs: validate
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: lucasoliveira04
          outputs: |
            github-profile-readmes/assets/animado/snake.svg
            github-profile-readmes/assets/animado/snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh sources and previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node github-profile-readmes/scripts/finish-snake.mjs
          node github-profile-readmes/scripts/update-profile.mjs
          node scripts/build-readme-gallery.mjs
          python3 scripts/package-readmes.py
          node --test github-profile-readmes/scripts/profile.test.mjs
          node scripts/check-readme-gallery.mjs
      - name: Commit updated kit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-profile-readmes
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh README gallery data'
          git push
