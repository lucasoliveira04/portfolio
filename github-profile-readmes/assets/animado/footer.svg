<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="106" viewBox="0 0 1200 106" role="img" aria-labelledby="title"><title id="title">Commit. Aprenda. Repita. Linha animada acompanha a mensagem.</title><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,'Liberation Mono',monospace}.drift{animation:drift 7s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.cursor{animation:pulse 2s ease-in-out infinite}@keyframes drift{50%{transform:translateY(-8px)}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="0" width="1200" height="106" rx="12" fill="#151a31" /><style>.sweep{animation:sweep 8s linear infinite}@keyframes sweep{from{transform:translateX(-120px)}to{transform:translateX(1200px)}}</style><text x="600" y="49" font-size="21" fill="#a4b7ec" class="mono" text-anchor="middle" letter-spacing="5">COMMIT. APRENDA. REPITA.</text><path d="M45 78H1155" stroke="#364363" stroke-width="2"/><path d="M0 78H120" stroke="#79ead1" stroke-width="3" class="sweep"/></svg>
