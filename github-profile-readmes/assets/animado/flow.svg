<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title"><title id="title">Ciclo ilustrado de desenvolvimento com pacotes animados: ideia, construir, investigar e aprender.</title><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,'Liberation Mono',monospace}.drift{animation:drift 7s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.cursor{animation:pulse 2s ease-in-out infinite}@keyframes drift{50%{transform:translateY(-8px)}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="0" width="1200" height="190" rx="14" fill="#101327" /><style>.packet{animation:packet 3s ease-in-out infinite}.p2{animation-delay:1s}.p3{animation-delay:2s}@keyframes packet{0%{transform:translateX(0);opacity:0}15%,80%{opacity:1}100%{transform:translateX(114px);opacity:0}}</style><text x="36" y="37" font-size="17" fill="#a7b9e4" class="mono" letter-spacing="1">IDEIA → CÓDIGO → TESTE → APRENDIZADO</text><rect x="36" y="78" width="220" height="70" rx="10" fill="#202945" stroke="#485d8a"/><text x="146" y="122" font-size="22" fill="#d9e5ff" class="mono" text-anchor="middle">IDEIA</text><path d="M256 114H335" stroke="#48607f" stroke-width="2"/><circle class="packet p1" cx="246" cy="114" r="5" fill="#6ff1d2"/><rect x="335" y="78" width="220" height="70" rx="10" fill="#202945" stroke="#485d8a"/><text x="445" y="122" font-size="22" fill="#d9e5ff" class="mono" text-anchor="middle">CONSTRUIR</text><path d="M555 114H634" stroke="#48607f" stroke-width="2"/><circle class="packet p2" cx="545" cy="114" r="5" fill="#6ff1d2"/><rect x="634" y="78" width="220" height="70" rx="10" fill="#202945" stroke="#485d8a"/><text x="744" y="122" font-size="22" fill="#d9e5ff" class="mono" text-anchor="middle">INVESTIGAR</text><path d="M854 114H933" stroke="#48607f" stroke-width="2"/><circle class="packet p3" cx="844" cy="114" r="5" fill="#6ff1d2"/><rect x="933" y="78" width="220" height="70" rx="10" fill="#202945" stroke="#485d8a"/><text x="1043" y="122" font-size="22" fill="#d9e5ff" class="mono" text-anchor="middle">APRENDER</text></svg>
